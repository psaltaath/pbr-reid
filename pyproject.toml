[project]
name = "pbr-reid"
version = "1.0.0"
description = "PBR-ReID: Learning Discriminative Prototypes via Boundary Repulsion MixUp for Object Re-Identification (WACV 2027)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "timm>=1.0.20",
    "open-clip-torch>=3.3.0",
    "numpy>=1.26",
    "pyyaml>=6.0.1",
    "rich>=14.1.0",
    "pillow>=10.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.11",
    "matplotlib>=3.5.0",
    "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party", "losses/heads", "datasets", "evaluation/reid.py"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
